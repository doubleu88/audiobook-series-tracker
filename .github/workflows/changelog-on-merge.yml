name: Update CHANGELOG on merge

# On every merged PR, reads the bump type + description from the PR body
# (validated by pr-checklist.yml before merge was ever allowed) and inserts
# the corresponding CHANGELOG.md entry, committed directly to main. That
# commit is what release.yml should tag and publish — but since this
# workflow pushes it using the default GITHUB_TOKEN, GitHub's loop
# -prevention rule means the push itself won't trigger release.yml's
# `push` trigger. So instead of relying on that, the last step here
# explicitly dispatches release.yml (workflow_dispatch is exempt from that
# same restriction). This workflow still deliberately doesn't tag/release
# itself, to avoid having two places that know how to do that.

"on":
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  update-changelog:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Extract bump type and description from the PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > /tmp/pr_body.md
          python3 scripts/parse_pr_changelog.py extract /tmp/pr_body.md > /tmp/extracted.txt
          head -n1 /tmp/extracted.txt > /tmp/bump_type.txt
          tail -n +2 /tmp/extracted.txt > /tmp/description.txt

      - name: Insert CHANGELOG.md entry
        run: |
          bump_type=$(cat /tmp/bump_type.txt)
          date=$(date -u +%Y-%m-%d)
          python3 scripts/insert_changelog_entry.py CHANGELOG.md "$bump_type" /tmp/description.txt "$date"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "Update CHANGELOG.md for #${{ github.event.pull_request.number }}"
          git push origin main

      - name: Trigger the release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref main
