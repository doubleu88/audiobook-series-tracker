name: Update CHANGELOG on merge

# On every merged PR, reads the bump type + description from the PR body
# (validated by pr-checklist.yml before merge was ever allowed) and inserts
# the corresponding CHANGELOG.md entry, committed directly to main. That
# commit is what release.yml tags and publishes — it picks this up on its
# own via its normal push trigger, since (see below) this workflow now
# pushes with ADMIN_PAT rather than the default token. This workflow still
# deliberately doesn't tag/release itself, to avoid having two places that
# know how to do that.
#
# main requires the "check" status (from pr-checklist.yml) on every push,
# not just on PR merges — a raw `git push` of a commit with no recorded
# status gets rejected outright (GH006). The commit this workflow makes is
# a deterministic derivative of a PR that already passed that check, so it
# self-certifies: it records a passing "check" status against its own
# commit SHA before pushing, rather than needing a real check run. The
# GitHub API refuses to attach a status to a commit it doesn't know about
# yet, so the commit is pushed to a scratch branch first (to make GitHub
# aware of the SHA), then the status is attached, then that same SHA is
# fast-forwarded onto main and the scratch branch is deleted.
#
# Deliberately pull_request_target, not pull_request: for a PR opened from
# a fork (i.e. any external contributor, not just maintainer-pushed test
# branches), GitHub forces GITHUB_TOKEN to read-only under `pull_request`
# regardless of the permissions block above — confirmed for real, this
# broke the push+dispatch outright (403) on the first genuine fork PR to
# go through this workflow. pull_request_target gets the real token. This
# is safe here specifically because nothing from the fork is ever checked
# out or executed: the checkout below is pinned to `ref: main`, and the
# only untrusted input used is the PR body text, passed through as a
# plain env var (never interpolated into a shell script), so there's no
# code-execution or injection surface for a malicious PR to exploit.
#
# main now also requires review from a code owner before merging (via a
# repo ruleset, bypassable only by the Admin role — GitHub Actions itself
# can't be added as a bypass actor on a personal-account repo, confirmed
# via a real 422 trying). So this workflow authenticates with ADMIN_PAT
# (a fine-grained PAT belonging to an actual Admin-role user, stored as a
# repo secret) instead of the default token for the checkout/push, since
# GITHUB_TOKEN-authored pushes have no way to bypass that rule at all.
# Side effect: a PAT push isn't subject to the GITHUB_TOKEN loop
# -prevention rule mentioned above, so it now reaches release.yml's push
# trigger on its own — this workflow used to also explicitly
# workflow_dispatch release.yml to work around that rule, but doing both
# raced the two runs against each other over the same tag (confirmed for
# real: both fired the same second, one lost with "tag already exists").
# Dropped the explicit dispatch; the push trigger alone is sufficient now.

"on":
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  statuses: write

jobs:
  update-changelog:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.ADMIN_PAT }}

      - name: Extract bump type and description from the PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > /tmp/pr_body.md
          python3 scripts/parse_pr_changelog.py extract /tmp/pr_body.md > /tmp/extracted.txt
          head -n1 /tmp/extracted.txt > /tmp/bump_type.txt
          tail -n +2 /tmp/extracted.txt > /tmp/description.txt

      - name: Insert CHANGELOG.md entry
        run: |
          bump_type=$(cat /tmp/bump_type.txt)
          date=$(date -u +%Y-%m-%d)
          python3 scripts/insert_changelog_entry.py CHANGELOG.md "$bump_type" /tmp/description.txt "$date"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "Update CHANGELOG.md for #${{ github.event.pull_request.number }}"

      - name: Self-certify the required check for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          scratch_ref="changelog-bot-tmp-${{ github.event.pull_request.number }}-${{ github.run_id }}"

          git push origin "HEAD:refs/heads/$scratch_ref"

          gh api "repos/${{ github.repository }}/statuses/$sha" \
            -f state=success \
            -f context=check \
            -f description="Deterministic changelog commit for PR #${{ github.event.pull_request.number }}, which already passed this check" \
            --silent

          git push origin main
          git push origin --delete "$scratch_ref"
