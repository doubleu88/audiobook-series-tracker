name: Gemini PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: string

concurrency:
  group: gemini-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GEMINI_CLI_TRUST_WORKSPACE: "true"
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}

    steps:
      - name: Checkout default branch only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Run Gemini PR review
        id: gemini
        uses: google-github-actions/run-gemini-cli@v0.1.22
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          github_pr_number: ${{ env.PR_NUMBER }}
          prompt: |
            You are reviewing GitHub PR #${{ env.PR_NUMBER }} in ${{ github.repository }}.

            Do not execute project code, install dependencies, or check out the PR branch.
            Read the change with:
              gh pr view ${{ env.PR_NUMBER }} --json title,body,author,files,baseRefName,headRefName
              gh pr diff ${{ env.PR_NUMBER }}

            Review for correctness, security, and performance. Be specific. Skip nits unless they can cause bugs.

            You MUST post the review with GitHub CLI (not stdout only):
              gh pr review ${{ env.PR_NUMBER }} --comment --body "$(cat <<'EOF'
            ...markdown review...
            EOF
            )"

            Do not approve. Do not request changes. Comment only.

            After posting, print exactly one JSON object and nothing else:
            {"posted": true, "recommendation": "COMMENT", "summary": "<2-4 sentence summary>"}

      - name: Parse Gemini summary
        id: parse
        env:
          RAW: ${{ steps.gemini.outputs.summary }}
        run: |
          set -euo pipefail
          JSON="$(printf '%s\n' "$RAW" | sed -n '/[[:space:]]*{/,$p' | jq -c 'if type=="object" then . else empty end' | tail -n1 || true)"
          if [ -z "$JSON" ]; then
            JSON="$(jq -nc --arg s "$RAW" '{posted:false,recommendation:"UNKNOWN",summary:$s}')"
          fi
          SUMMARY="$(jq -r '.summary // "Gemini finished a review."' <<<"$JSON")"
          {
            echo "recommendation=$(jq -r '.recommendation // "UNKNOWN"' <<<"$JSON")"
            echo "summary<<EOF"
            printf '%s\n' "$SUMMARY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Confirm a review was posted
        run: |
          set -euo pipefail
          COUNT="$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/reviews" \
            --jq '[.[] | select(.user.login=="github-actions[bot]" or .body != "")] | length')"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::Gemini did not post a PR review"
            exit 1
          fi

      - name: Notify Telegram
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUMMARY: ${{ steps.parse.outputs.summary }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          PR_JSON="$(gh pr view "$PR_NUMBER" --json title,url,author)"
          TITLE="$(jq -r '.title' <<<"$PR_JSON")"
          URL="$(jq -r '.url' <<<"$PR_JSON")"
          AUTHOR="$(jq -r '.author.login' <<<"$PR_JSON")"
          MESSAGE="$(printf 'Gemini reviewed %s#%s\n%s\nAuthor: %s\n\n%s\n\n%s' \
            "$REPO" "$PR_NUMBER" "$TITLE" "$AUTHOR" "$SUMMARY" "$URL")"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"
