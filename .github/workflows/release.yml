name: Auto-release from CHANGELOG

# Automates what was previously a manual step after every merge: bump
# CHANGELOG.md, tag, and create a GitHub Release. This fires on every push
# to main and does nothing unless CHANGELOG.md's topmost "## [X.Y.Z] -
# YYYY-MM-DD" entry doesn't have a matching tag yet — so it's safe to run
# on every push, including ones that don't touch the changelog at all.

"on":
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract latest changelog entry
        id: changelog
        run: |
          version=$(python3 scripts/latest_changelog_entry.py CHANGELOG.md release_notes.md)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already tagged
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.changelog.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag and release
        if: steps.check_tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v${{ steps.changelog.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$version" -m "$version"
          git push origin "$version"
          gh release create "$version" --title "$version" --notes-file release_notes.md
