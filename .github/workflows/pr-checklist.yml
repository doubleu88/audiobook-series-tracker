name: PR checklist

# Required status check enforcing the PR template (.github/pull_request_template.md):
# exactly one version-bump box checked, and a non-empty changelog description.
# This is what changelog-on-merge.yml reads at merge time to write the
# CHANGELOG.md entry automatically — this check existing and passing is what
# makes that automation reliable enough to trust without a human re-checking
# the PR body by hand before every merge.

"on":
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

permissions:
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PR description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > /tmp/pr_body.md
          python3 scripts/parse_pr_changelog.py validate /tmp/pr_body.md
