{% extends "base.html" %}
{% block content %}
<div class="auth-wrap" style="margin-top: 2rem;">
  <div class="auth-card">
    <h2>Change password</h2>
    {% if error %}<p class="error" style="margin-top:0;">{{ error }}</p>{% endif %}
    {% if success %}<p class="success-msg" style="margin-top:0;">Password updated.</p>{% endif %}
    <form method="post" action="/account/password">
      <div class="field">
        <label for="current_password">Current password</label>
        <input type="password" id="current_password" name="current_password" required autofocus>
      </div>
      <div class="field">
        <label for="new_password">New password</label>
        <input type="password" id="new_password" name="new_password" required minlength="8">
      </div>
      <div class="field">
        <label for="confirm_password">Confirm new password</label>
        <input type="password" id="confirm_password" name="confirm_password" required minlength="8">
      </div>
      <button class="btn" type="submit">Update password</button>
    </form>
    <p class="auth-switch"><a href="/">&larr; Back to dashboard</a></p>
  </div>
</div>
{% endblock %}
