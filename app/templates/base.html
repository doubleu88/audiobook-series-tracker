<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audiobook Series Tracker</title>
  <style>
    :root {
      --bg: #0b0d10;
      --surface: #15181d;
      --surface-hover: #1c2027;
      --border: #262b33;
      --text: #e8eaed;
      --text-muted: #8b92a0;
      --accent: #7c9eff;
      --accent-strong: #a5bcff;
      --accent-soft: rgba(124, 158, 255, 0.14);
      --success-bg: rgba(52, 211, 153, 0.14);
      --success-text: #5eead4;
      --warning-bg: rgba(251, 191, 36, 0.14);
      --warning-text: #fbbf7a;
      --danger-text: #f87171;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      color-scheme: dark;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f5f6f8;
        --surface: #ffffff;
        --surface-hover: #f0f1f4;
        --border: #e3e5e9;
        --text: #191b1f;
        --text-muted: #6b7280;
        --accent: #4f6bed;
        --accent-strong: #3951c6;
        --accent-soft: rgba(79, 107, 237, 0.1);
        --success-bg: rgba(16, 185, 129, 0.12);
        --success-text: #0d9668;
        --warning-bg: rgba(217, 119, 6, 0.12);
        --warning-text: #b45309;
        --danger-text: #dc2626;
        --shadow: 0 6px 20px rgba(20, 20, 30, 0.08);
        color-scheme: light;
      }
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 1080px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-strong); text-decoration: underline; }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.25rem;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .top-row h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.02em;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--accent);
      color: #0b0d10;
      font-weight: 600;
      font-size: 0.85rem;
      padding: 0.5rem 0.9rem;
      border-radius: var(--radius-sm);
      border: none;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .btn:hover { background: var(--accent-strong); text-decoration: none; transform: translateY(-1px); }
    @media (prefers-color-scheme: light) { .btn { color: #ffffff; } }

    section.block { margin-top: 2.25rem; }

    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.9rem;
    }

    .section-head h2 {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .threshold-form {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .threshold-form input[type=number] {
      width: 3.2rem;
      padding: 0.25rem 0.4rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.8rem;
    }
    .threshold-form button {
      background: var(--surface-hover);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: var(--radius-sm);
      padding: 0.25rem 0.6rem;
      font-size: 0.78rem;
      cursor: pointer;
    }
    .threshold-form button:hover { border-color: var(--accent); color: var(--accent); }

    .empty-hint {
      color: var(--text-muted);
      font-size: 0.9rem;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 1rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow);
      border-color: var(--accent);
    }

    .card .cover-wrap {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: var(--surface-hover);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
    }
    .card img.cover-lg { width: 100%; height: 100%; object-fit: cover; display: block; }

    .card .body { padding: 0.65rem 0.75rem 0.85rem; }
    .card .title {
      font-weight: 600;
      font-size: 0.88rem;
      line-height: 1.3;
      margin: 0 0 0.2rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card .series-name {
      font-size: 0.76rem;
      color: var(--text-muted);
      margin: 0 0 0.5rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 0.65rem 0.6rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
    th {
      color: var(--text-muted);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-weight: 600;
      white-space: nowrap;
    }
    tbody tr { transition: background 0.1s ease; }
    tbody tr:hover { background: var(--surface-hover); }

    .series-table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow-x: auto;
    }
    .series-table-wrap table { min-width: 640px; }
    .series-table-wrap th:first-child, .series-table-wrap td:first-child { padding-left: 1rem; }

    img.cover-sm {
      width: 42px;
      height: 42px;
      object-fit: cover;
      border-radius: 6px;
      display: block;
      background: var(--surface-hover);
    }
    .cover-sm-placeholder {
      width: 42px;
      height: 42px;
      border-radius: 6px;
      background: var(--surface-hover);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }

    .series-name-cell { font-weight: 600; }
    .meta-muted { color: var(--text-muted); font-size: 0.82rem; }

    .badge {
      display: inline-block;
      padding: 0.18rem 0.55rem;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .badge-ended { background: var(--surface-hover); color: var(--text-muted); }
    .badge-ongoing { background: var(--success-bg); color: var(--success-text); }
    .badge-date { background: var(--accent-soft); color: var(--accent-strong); }
    .badge-unknown { background: var(--warning-bg); color: var(--warning-text); }

    form.inline { display: inline; }
    .row-actions { display: flex; gap: 0.6rem; flex-wrap: nowrap; white-space: nowrap; }
    button.link {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0;
      font: inherit;
      font-size: 0.78rem;
    }
    button.link:hover { color: var(--accent); text-decoration: underline; }

    input[type=text] {
      width: 100%;
      padding: 0.6rem 0.7rem;
      font-size: 1rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
    }
    input[type=text]:focus, .threshold-form input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .error { color: var(--danger-text); margin: 1rem 0; }
    code {
      background: var(--surface-hover);
      padding: 0.1rem 0.35rem;
      border-radius: 4px;
      font-size: 0.85em;
    }
  </style>
</head>
<body>
  <div class="top-row">
    <h1>🎧 Audiobook Series Tracker</h1>
    <a class="btn" href="/search">+ Add series</a>
  </div>
  {% block content %}{% endblock %}
</body>
</html>
