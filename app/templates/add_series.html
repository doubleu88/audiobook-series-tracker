{% extends "base.html" %}
{% block content %}
<section class="block" style="margin-top: 1.5rem;">
  <p><a href="/search">&larr; Back to search</a></p>
  <div class="section-head">
    <h2>🔗 Subscribe by URL</h2>
  </div>
  <p class="meta-muted">Paste the Audible series page URL (e.g. <code>https://www.audible.com/series/.../B0937JMKYV</code>) or just the series ASIN.</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/add" style="display:flex; gap:0.6rem; max-width: 520px;">
    <input type="text" name="url" placeholder="https://www.audible.com/series/..." required>
    <button class="btn" type="submit">Subscribe</button>
  </form>
</section>
{% endblock %}
