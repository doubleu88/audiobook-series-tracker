{% extends "base.html" %}
{% block content %}
<p><a href="/search">&larr; Back to search</a></p>
<h2>Subscribe by URL</h2>
<p>Paste the Audible series page URL (e.g. <code>https://www.audible.com/series/.../B0937JMKYV</code>) or just the series ASIN.</p>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/add">
  <input type="text" name="url" placeholder="https://www.audible.com/series/..." required>
  <br><br>
  <button type="submit">Subscribe</button>
</form>
{% endblock %}
