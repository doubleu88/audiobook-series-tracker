{% extends "base.html" %}
{% block header %}
<header class="topbar">
  <a href="/login" class="brand"><span>🎧</span><span class="brand-text">Audiobook Series Tracker</span></a>
</header>
{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h2>Log in</h2>
    {% if error %}<p class="error" style="margin-top:0;">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button class="btn" type="submit">Log in</button>
    </form>
    {% if signup_open %}
    <p class="auth-switch">No account yet? <a href="/signup">Sign up</a></p>
    {% else %}
    <p class="auth-switch">New accounts are created by an admin.</p>
    {% endif %}
  </div>
</div>
{% endblock %}
